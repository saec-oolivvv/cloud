            libsoup3-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            openssl-devel \
            pkgconf-pkg-config \
            file \
            cairo-gobject-devel \
            pango-devel \
            atk-devel \
            gdk-pixbuf2-devel \
            libgirepository1.0-devel

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: saec-sync/package-lock.json

      - name: Install npm dependencies
        working-directory: saec-sync
        run: npm ci

      - name: Build frontend
        working-directory: saec-sync
        run: npm run build

      - name: Build Tauri app (.rpm)
        working-directory: saec-sync/src-tauri
        run: cargo tauri build --target x86_64-unknown-linux-gnu -- --rpm

      - name: Find RPM artifact
        id: find-rpm
        run: |
          rpm=$(find target/x86_64-unknown-linux-gnu/release/bundle/rpm -name "*.rpm" 2>/dev/null | head -1)
          if [ -n "$rpm" ]; then
            echo "rpm_path=$rpm" >> $GITHUB_OUTPUT
            echo "rpm_name=$(basename $rpm)" >> $GITHUB_OUTPUT
          else
            echo "No RPM found in target/x86_64-unknown-linux-gnu/release/bundle/rpm/"
            ls -la target/x86_64-unknown-linux-gnu/release/bundle/rpm/ 2>/dev/null || echo "rpm dir not found"
            find target -name "*.rpm" 2>/dev/null || echo "no .rpm anywhere"
            exit 1
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAEC-Sync-Linux-RPM
          path: ${{ steps.find-rpm.outputs.rpm_path }}
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # LINUX APPIMAGE (Ubuntu 24.04)
