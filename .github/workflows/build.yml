      - name: Find AppImage artifact
        id: find-appimage
        run: |
          appimage=$(find target/x86_64-unknown-linux-gnu/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
