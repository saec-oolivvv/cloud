name: Build SAEC Sync DMG

on:
  push:
    tags:
      - 'v*'          # déclenché à chaque nouveau tag (ex: v0.1.43)
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install 2>/dev/null || true
          # Attendre que les tools soient dispo
          until [ -x "/usr/bin/productbuild" ]; do
            sleep 10
            echo "En attente des Xcode CLI..."
          done
          echo "✅ Xcode CLI disponibles"

      - name: Install Rust targets (Intel + Apple Silicon)
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            saec-sync/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('saec-sync/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saec-sync/package-lock.json

      - name: Install dependencies
        working-directory: saec-sync
        run: npm ci

      - name: Build Tauri DMG for Intel (x86_64)
        working-directory: saec-sync
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          ./node_modules/.bin/tauri build --target x86_64-apple-darwin

      - name: Build Tauri DMG for Apple Silicon (arm64)
        working-directory: saec-sync
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          ./node_modules/.bin/tauri build --target aarch64-apple-darwin

      - name: Locate generated DMGs
        id: find-dmgs
        run: |
          $dmgPaths_intel = @(
            "saec-sync/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
          )
          $dmgPaths_arm = @(
            "saec-sync/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
          )

          $all_dmgs = @()
          
          foreach ($pattern in $dmgPaths_intel) {
            $files = Get-ChildItem $pattern -ErrorAction SilentlyContinue
            if ($files) {
              $all_dmgs += $files[0].FullName
            }
          }
          
          foreach ($pattern in $dmgPaths_arm) {
            $files = Get-ChildItem $pattern -ErrorAction SilentlyContinue
            if ($files) {
              $all_dmgs += $files[0].FullName
            }
          }

          if ($all_dmgs.Count -eq 0) {
            throw "Aucun DMG trouvé dans les dossiers de sortie attendus"
          }

          # Output all DMG paths as comma-separated list
          $dmg_list = ($all_dmgs -join ",")
          echo "dmg_paths=$dmg_list" >> $env:GITHUB_OUTPUT

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SAEC Sync ${{ github.ref_name }}"
          files: ${{ steps.find-dmgs.outputs.dmg_paths }}
          overwrite: true
          generate_release_notes: true

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saec-sync-dmgs
          path: ${{ steps.find-dmgs.outputs.dmg_paths }}
          retention-days: 30