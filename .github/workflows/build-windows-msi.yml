name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.20)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            saec-sync/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install WiX Toolset v3.14
        run: |
          # Check if WiX is already installed
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe") {
            Write-Host "WiX Toolset v3.14 already installed"
          } else {
            choco install wixtoolset -y --version 3.14.1 --force
          }
          # Add WiX to PATH for this session
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.14\bin"
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Verify MSBuild
        run: where msbuild

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: saec-sync/package-lock.json

      - name: Install npm dependencies
        working-directory: saec-sync
        run: npm ci

      - name: Build frontend
        working-directory: saec-sync
        run: npm run build

      - name: Create ICO from PNG for Windows
        working-directory: saec-sync/src-tauri
        run: |
          # Use Python with Pillow to create ICO (more reliable on GitHub Actions)
          python -c "
import sys
import os
from PIL import Image

input_path = 'icons/icon.png'
output_path = 'icons/icon.ico'

if not os.path.exists(input_path):
    print(f'Input PNG not found: {input_path}')
    sys.exit(1)

# Open the PNG
img = Image.open(input_path)

# Create ICO with multiple sizes
sizes = [(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
images = []
for size in sizes:
    resized = img.resize(size, Image.Resampling.LANCZOS)
    images.append(resized)

# Save as ICO
images[0].save(
    output_path,
    format='ICO',
    sizes=[img.size for img in images]
)

print(f'ICO created successfully: {output_path}')
print(f'File size: {os.path.getsize(output_path)} bytes')
          "
        working-directory: saec-sync/src-tauri
        run: |
          # Install tauri-cli if not present
          if (!(Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            Write-Host "Installing tauri-cli..."
            cargo install tauri-cli --version "^2.0" --locked 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install tauri-cli"
              exit 1
            }
          }
          Write-Host "tauri-cli installed successfully"
          # Tauri v2: MSI is built via bundle targets (configured in tauri.conf.json)
          # No --msi flag needed - bundle targets include MSI on Windows
          cargo tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Find MSI artifact
        id: find-msi
        run: |
          $msi = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            echo "msi_name=$($msi.Name)" >> $env:GITHUB_OUTPUT
            echo "##[group]MSI found"
            echo "Path: $($msi.FullName)"
            echo "Size: $([math]::Round($msi.Length / 1MB, 1)) MB"
            echo "##[endgroup]"
          } else {
            Write-Error "No MSI found in target/x86_64-pc-windows-msvc/release/bundle/msi/"
            Get-ChildItem -Path "target" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAEC-Sync-Windows-MSI
          path: ${{ steps.find-msi.outputs.msi_path }}
          retention-days: 30

      - name: Create/Update Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-msi.outputs.msi_path }}
          name: SAEC Sync ${{ github.ref_name }}
          body: |
            ## SAEC Sync Desktop Client - Windows

            ### Windows Installer (MSI)

            **Installation**
            1. Téléchargez `SAEC Sync_${{ github.ref_name }}_x64.msi`
            2. Double-cliquez pour installer (installation par utilisateur, pas d'admin requis)
            3. Lancez "SAEC Sync" depuis le menu Démarrer

            ### Configuration
            - Au premier lancement, le client affiche un **code d'appareil** (ex: `ABCD-EFGH`)
            - Une page s'ouvre automatiquement dans le navigateur : `https://cloud.saec.me/device?code=XXXX`
            - Connectez-vous à SAEC Cloud et **autorisez l'appareil**
            - La synchronisation démarre automatiquement

            ### Fonctionnalités
            - Sync bidirectionnelle temps réel (AES-256-GCM)
            - Tray icon + notifications natives
            - Multi-provider (S3, Dropbox, GDrive, OneDrive, SFTP, WebDAV)
            - Résolution de conflits (Last-Write-Wins, Keep Both, Ask)
            - Open source (Rust + Tauri + React)

            ### Exigences
            - Windows 10 1903+ (x64)
            - Compte SAEC Cloud avec mount configuré par admin

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}